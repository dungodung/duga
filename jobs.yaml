# Toolforge job schedule (toolforge jobs load jobs.yaml).
#
# Declarative on purpose: `toolforge jobs` has no `create`, so the schedule
# used to be a sequence of hand-typed `run --schedule` invocations that
# nothing in the repo recorded. Keeping it here means the live crontab has
# a reviewable source, and restoring a job someone deleted is one command.
#
# filelog: true on every job. Without it a failed run leaves nothing behind
# but an exit code -- which is exactly what happened to wp-no-article on
# 2026-08-30: the failure email says "if you requested 'filelog'... check
# the log files", and nobody had.
#
# Logs land in /data/project/duga/<job-name>.out and .err -- the tool's home
# directory, NOT the logs/ subdirectory next to it, which stays empty and is
# an easy place to waste time looking.
#
# `python3 -u` because Python buffers stdout when it is a file rather than a
# tty. A job that exits normally flushes anyway, but one that is killed
# (OOM, eviction, timeout) loses whatever is still buffered -- which is
# exactly the case a post-mortem needs. Unbuffered, each line lands as it
# happens.
#
# `mount: all` is required for it -- Toolforge refuses filelog without a
# writable /data/project ("File logging is only available with
# --mount=all"). The webservice itself still runs --mount=none; this
# applies to the jobs only.
#
# Spacing: 30 minutes. The stable detectors took ~3m20s each when Duga
# tracked two content languages; at ten they take ~13-17 minutes, so the
# original 20-minute slots had no headroom left. impact-score runs last
# because it scores whatever gap rows exist that day -- its first run each
# month is the slow one (empty pageview_cache for the new month), the rest
# are near-instant.
- command: python3 -u jobs/scope_fetch.py
  emails: onfailure
  filelog: true
  mount: all
  image: tool-duga/tool-duga:latest
  name: scope-fetch
  schedule: 0 2 * * *
- command: python3 -u jobs/topic_refresh.py
